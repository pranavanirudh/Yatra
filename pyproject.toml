[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yatra"
version = "1.1.0"
description = "Regime-separated forecasting of pilgrimage footfall at Shri Mata Vaishno Devi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pranav Anirudh M" }]

# Ranges are capped at the next major deliberately. An unbounded floor makes the
# resolved environment a function of the date you ran pip, which means two
# machines on one repo can disagree about a MASE in the fourth decimal and
# nobody can reproduce the run that produced results/metrics.csv. Bump a cap on
# purpose, re-run `make all`, and check the metrics diff.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    # Holt-Winters (ExponentialSmoothing) and SARIMA(X) both come from here.
    # These are the estimators the headline finding is about, so the cap is
    # load-bearing: statsmodels has changed ETS initialisation defaults across
    # minors before, which silently moves every clean-month number.
    "statsmodels>=0.14,<1",
    # Spearman rank correlation for the clean-vs-shock inversion statistic.
    "scipy>=1.11,<2",
    "PyYAML>=6.0,<7",
    "matplotlib>=3.8,<4",
    # The ephemeris backend named in experiments/configs/calendar.yaml. It is a
    # HARD dependency, unlike the swisseph extra below, because it is the
    # backend that produced every committed artefact and the one the calendar
    # tests validate against published almanacs. ephemeris.py refuses to fall
    # back to another backend, so without this the calendar stage -- and
    # therefore `make all` -- stops at EphemerisUnavailable.
    "skyfield>=1.45,<2",
]

# The pipeline, after `pip install .`, without the repository checked out or
# `make` installed: `yatra validate`, `yatra all`, `yatra ingest --inspect f.csv`.
# It enters the same dispatcher `make.py` enters -- one implementation of what
# a target is and what `all` means, because two would drift and the entry point
# nobody runs is the one that rots.
[project.scripts]
yatra = "yatra.cli:main"

[project.optional-dependencies]
# types-PyYAML is the stub package for PyYAML, so yaml is checked rather than
# waved through. It is listed here for the same reason mypy is: a checker that
# only passes on the machine that has the stubs installed is not a check.
dev = ["pytest>=8.0,<9", "mypy>=1.8,<2", "types-PyYAML>=6.0,<7"]

# The ephemeris backend is an extra rather than a hard dependency because
# pyswisseph is source-only on Windows and needs an MSVC toolchain. See
# docs/ephemeris.md -- src/yatra/ephemeris.py refuses to fall back silently.
swisseph = ["pyswisseph>=2.10,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/yatra"]

[tool.mypy]
# `mypy` with no arguments checks the package, so the command in CI, the
# command in a hook and the command somebody types are the same command.
files = ["src/yatra"]

# No `python_version` pin, though the project floor is 3.11 and pinning it here
# is what you would want. NumPy 2.x ships stubs written with `type` statements,
# which mypy refuses to parse under a declared 3.11 and which stop the run
# before any of this project's code is read. The check therefore runs at the
# version of the interpreter it is invoked with. Do not re-add the pin without
# checking that against the installed numpy.

# The scientific stack ships no type information: no stubs in the package, no
# py.typed marker. Naming those libraries here says "this import cannot be
# resolved to types", which is true of them and of nothing else -- it is not a
# switch that hides errors in this project's own code, and there is no
# module-level or file-level ignore anywhere in src/yatra.
#
# The cost is real and worth stating: pandas, numpy-adjacent and statsmodels
# calls are checked as `Any`, so a typo in a keyword argument to
# `ExponentialSmoothing` is not caught here. `pandas-stubs` would close most of
# that gap and is a separate piece of work -- it types a codebase this
# pandas-heavy strictly enough that adopting it is a change to the code, not to
# the configuration.
[[tool.mypy.overrides]]
module = [
    "pandas",
    "scipy.*",
    "skyfield.*",
    "statsmodels.*",
    "matplotlib.*",
    # The optional Swiss Ephemeris backend. Not installed on this machine by
    # design -- see docs/ephemeris.md -- so it cannot be resolved at all here.
    "swisseph",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Calendar tests are the ones whose failure invalidates every ablation result,
# so they are marked and run first in `make test`.
markers = [
    "calendar: festival-date computation validated against published almanacs",
    "needs_data: requires the observation files under data/raw/",
]
