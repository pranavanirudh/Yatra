# Shock windows.
#
# These are EVALUATION LABELS. They partition the backtest results into clean
# and shock months so the two leaderboards can be compared. They are never an
# input to a model -- see CLAUDE.md 3.4. backtest.py has no code path that
# passes this file into a fit call.
#
# Every window needs a `source` block. regimes.py raises MissingCitation
# without one, and raises again if a source lacks publisher/title/url/accessed.
# This is not a warning: an undocumented shock window is an unfalsifiable claim
# about which months were disrupted, and the whole finding is a comparison
# between the two sides of that line.
#
# STATUS 2026-08-18: drafted by Claude from public reporting, NOT yet verified
# by the project owner against the shrine board's own records. The `verified`
# flag below is false for all three. regimes.py accepts unverified windows but
# report.py stamps the README with a warning while any remain false. Flip them
# only after reading the cited source.

schema_version: 1

windows:
  - id: article_370
    label: "Article 370 abrogation and J&K communications lockdown"
    start: 2019-08
    end: 2019-10
    verified: false
    rationale: >
      Special status revoked 5 August 2019, accompanied by movement
      restrictions, a suspended communications network and a standing advisory
      against non-essential travel to the union territory. Yatra registration
      was not formally closed, but access to Katra and onward travel was
      materially constrained through the autumn. Annual footfall fell to
      79.40 lakh in 2019 from 85.87 lakh in 2018.
    source:
      publisher: Deccan Herald
      title: "Tourism in Kashmir region hit hard after Article 370 revocation"
      url: https://www.deccanherald.com/national/north-and-central/tourism-in-kashmir-region-hit-hard-after-article-370-revocation-946673.html
      accessed: 2026-08-18
    corroborating_source:
      publisher: The Tribune
      title: "Vaishno Devi records steep decline in visitors this year"
      url: https://www.tribuneindia.com/news/j-k/vaishno-devi-records-steep-decline-in-visitors-this-year/
      accessed: 2026-08-18

  - id: covid
    label: "COVID-19 closure and capped reopening"
    start: 2020-03
    end: 2021-12
    verified: false
    rationale: >
      Yatra suspended 18 March 2020. Reopened 16 August 2020 under a cap of
      2,000 pilgrims per day, of whom only 100 could come from outside J&K --
      a ceiling roughly two orders of magnitude below normal throughput, so the
      reopening does not end the shock. The window is held open through 2021 to
      cover the second wave and the staged relaxation of the cap. Annual
      footfall was 17 lakh in 2020.
      The end date is the most arguable choice in this file: recovery was
      gradual and no single month marks a return to baseline. Sensitivity to
      this boundary is worth reporting explicitly.
    source:
      publisher: The Tribune
      title: "COVID-19: Vaishno Devi Yatra to resume as J&K to open religious places from August 16"
      url: https://www.tribuneindia.com/news/j-k/covid-19-vaishno-devi-yatra-to-resume-as-jk-to-open-religious-places-from-august-16-122088
      accessed: 2026-08-18
    corroborating_source:
      publisher: The Tribune
      title: "J&K suspends Vaishno Devi yatra, bans inter-state buses"
      url: https://www.tribuneindia.com/news/jk-suspends-vaishno-devi-yatra-bans-inter-state-buses-57618
      accessed: 2026-08-18

  - id: floods_2025
    # NOTE ON THE ID: it now understates the window. This is a COMPOUND
    # disruption -- a security shock from May, then a landslide closure from
    # late August -- and `floods_2025` names only the second half. The id is
    # kept because it already appears in results/metrics.csv and in published
    # tables; renaming it is a separate, deliberate change. The label and the
    # rationale below carry the actual cause.
    label: "J&K security shock and monsoon landslide closure (compound)"
    start: 2025-05
    end: 2025-09
    verified: false
    rationale: >
      Originally declared 2025-08..2025-09 and anchored on the landslide alone.
      That start date was wrong: it began at the second of two causes, so the
      deeper first one was scored as an ordinary month.

      Two distinct events suppressed the yatra in 2025.

      First, security. The Pahalgam attack of 22 April 2025 killed 26 people,
      and Operation Sindoor in May brought border tension. Regional religious
      tourism fell immediately: May 2025 recorded 413,365 pilgrims against
      1,164,301 in May 2024, a fall of 750,936 or 64.5%. June recovered to
      926,263 once a sense of security returned, so the security shock is
      concentrated in May rather than sustained.

      Second, the track. A landslide at Ardhkuwari on 26 August 2025, triggered
      by heavy rain, killed 35 pilgrims, damaged the route and forced a closure
      of about three weeks in what is normally a high-traffic period. September
      2025 fell to 185,165, its lowest non-COVID value in the record.

      Both are included because both suppressed the same series in the same
      year, and a window covering only the landslide would put the larger
      absolute fall in the clean bucket. May's year-on-year drop (750,936) is
      larger in absolute terms than September's (493,322), though September's is
      the larger proportional fall.

      June and July sit inside the window at 79% and 88% of the 2015-2018
      same-month mean. They are neither clearly disrupted nor clearly normal,
      and holding the window continuous across them is the arguable part of this
      declaration. `shocks_refined.yaml` is where that boundary is tested.
    source:
      publisher: Press Trust of India (via Kashmir Observer)
      title: "Pilgrim Numbers Decline at Vaishno Devi Due to Security, Weather Issues"
      url: https://kashmirobserver.net/2025/12/29/pilgrim-numbers-decline-at-vaishno-devi-due-to-security-weather-issues/
      accessed: 2026-08-18
    corroborating_source:
      publisher: News on AIR (Prasar Bharati)
      title: "Vaishno Devi Yatra resumes after 22-day suspension due to landslides"
      url: https://www.newsonair.gov.in/vaishno-devi-yatra-resumes-after-22-day-suspension-due-to-landslides
      accessed: 2026-08-18

# Months not covered by any window above are "clean". There is no third
# category. A month is scored on the regime it belongs to at the TARGET date,
# not at the forecast origin -- a clean-origin forecast landing inside COVID is
# a shock-month forecast, because that is the month the model got wrong.
